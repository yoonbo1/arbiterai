# Deploys the static site (site/) to GitHub Pages at https://www.arbiterai.tech.
# Replaces the Heroku app (arbiterai-site), which no longer exists. Pages serves files only, so
# two things wsgi.py did are handled differently here:
# * the retired-path redirects (wsgi.py REDIRECTS) become small redirect pages, written below;
# * the security headers (wsgi.py SECURITY_HEADERS) can't be set on Pages. The site is static,
#   with no forms, cookies or third-party scripts, so nothing depends on them.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a deploy in progress is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build site
        working-directory: site
        env:
          SITE_URL: https://www.arbiterai.tech
        run: python build.py

      # Same table as wsgi.py REDIRECTS: inbound links may still carry these paths.
      - name: Write redirect pages for retired paths
        working-directory: site/public
        run: |
          redirect() {
            cat > "$1" <<EOF
          <!doctype html><meta charset="utf-8"><title>Moved</title>
          <link rel="canonical" href="https://www.arbiterai.tech$2">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$2">
          <p>Moved to <a href="$2">$2</a>.</p>
          EOF
          }
          redirect pricing.html /
          redirect product.html /how-it-works.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
